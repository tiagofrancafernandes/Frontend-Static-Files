<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Index de Arquivos & Protótipos</title>
        <script type="module">
            import 'iconify-icon';
        </script>
        <style>
            :root {
                --bg: #090d16;
                --bg-surface: #0f172a;
                --bg-card: #1e293b;
                --bg-card-hover: #273548;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --accent: #38bdf8;
                --accent-hover: #0ea5e9;
                --border: #334155;
                --border-subtle: #1e293b;
                --badge-bg: rgba(56, 189, 248, 0.12);
                --badge-text: #7dd3fc;
                --success: #34d399;
                --success-bg: rgba(52, 211, 153, 0.12);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    Roboto,
                    Oxygen,
                    Ubuntu,
                    Cantarell,
                    sans-serif;
                background-color: var(--bg);
                color: var(--text-main);
                min-height: 100vh;
                padding: 2.5rem 1.25rem 5rem;
            }

            .container {
                max-width: 1040px;
                margin: 0 auto;
            }

            header {
                margin-bottom: 2rem;
                padding-bottom: 1.5rem;
                border-bottom: 1px solid var(--border);
            }

            .header-row {
                display: flex;
                align-items: center;
                gap: 0.85rem;
                margin-bottom: 0.5rem;
            }

            .header-icon {
                font-size: 2.25rem;
                color: var(--accent);
            }

            h1 {
                font-size: 2rem;
                font-weight: 700;
                letter-spacing: -0.025em;
            }

            .subtitle {
                color: var(--text-muted);
                font-size: 0.975rem;
                line-height: 1.5;
            }

            /* Search and Toolbar */
            .toolbar {
                display: flex;
                flex-wrap: wrap;
                gap: 1rem;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 2rem;
            }

            .search-wrapper {
                position: relative;
                flex: 1;
                min-width: 280px;
                max-width: 540px;
            }

            .search-icon {
                position: absolute;
                left: 1rem;
                top: 50%;
                transform: translateY(-50%);
                color: var(--text-muted);
                font-size: 1.15rem;
                pointer-events: none;
            }

            .search-input {
                width: 100%;
                padding: 0.8rem 2.5rem 0.8rem 2.85rem;
                border-radius: 0.65rem;
                border: 1px solid var(--border);
                background-color: var(--bg-surface);
                color: var(--text-main);
                font-size: 0.95rem;
                outline: none;
                transition:
                    border-color 0.2s,
                    box-shadow 0.2s;
            }

            .search-input:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
            }

            .search-clear {
                position: absolute;
                right: 0.75rem;
                top: 50%;
                transform: translateY(-50%);
                background: none;
                border: none;
                color: var(--text-muted);
                cursor: pointer;
                font-size: 1.25rem;
                display: none;
                padding: 0.25rem;
                line-height: 1;
            }

            .search-clear:hover {
                color: var(--text-main);
            }

            .toolbar-actions {
                display: flex;
                align-items: center;
                gap: 0.75rem;
            }

            .stats-badge {
                display: inline-flex;
                align-items: center;
                gap: 0.45rem;
                padding: 0.5rem 0.95rem;
                border-radius: 9999px;
                background-color: var(--badge-bg);
                color: var(--badge-text);
                font-size: 0.875rem;
                font-weight: 500;
                border: 1px solid rgba(56, 189, 248, 0.2);
            }

            .btn-toggle-all {
                background-color: var(--bg-surface);
                border: 1px solid var(--border);
                color: var(--text-muted);
                padding: 0.5rem 0.85rem;
                border-radius: 0.5rem;
                font-size: 0.85rem;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                gap: 0.4rem;
                transition: all 0.15s;
            }

            .btn-toggle-all:hover {
                color: var(--text-main);
                border-color: var(--accent);
            }

            /* Index Section */
            .index-container {
                background-color: var(--bg-surface);
                border: 1px solid var(--border);
                border-radius: 0.85rem;
                overflow: hidden;
            }

            .index-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 1.25rem 1.5rem;
                background-color: rgba(30, 41, 59, 0.4);
                border-bottom: 1px solid var(--border);
            }

            .index-title {
                display: flex;
                align-items: center;
                gap: 0.6rem;
                font-size: 1.15rem;
                font-weight: 600;
            }

            .index-title iconify-icon {
                color: var(--accent);
                font-size: 1.35rem;
            }

            /* Folder Accordion */
            .folder-item {
                border-bottom: 1px solid var(--border-subtle);
            }

            .folder-item:last-child {
                border-bottom: none;
            }

            .folder-trigger {
                width: 100%;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 1.1rem 1.5rem;
                background-color: transparent;
                border: none;
                color: inherit;
                text-align: left;
                cursor: pointer;
                font-size: 1rem;
                transition: background-color 0.15s;
            }

            .folder-trigger:hover {
                background-color: rgba(51, 65, 85, 0.25);
            }

            .folder-trigger-left {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                flex: 1;
                min-width: 0;
            }

            .folder-icon {
                font-size: 1.35rem;
                color: #fbbf24;
                flex-shrink: 0;
            }

            .folder-name {
                font-weight: 600;
                color: var(--text-main);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .folder-count-pill {
                font-size: 0.75rem;
                padding: 0.2rem 0.6rem;
                border-radius: 9999px;
                background-color: var(--bg-card);
                color: var(--text-muted);
                margin-left: 0.5rem;
                flex-shrink: 0;
            }

            .folder-trigger-right {
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }

            .folder-chevron {
                font-size: 1rem;
                color: var(--text-muted);
                transition: transform 0.2s ease;
            }

            .folder-item.open .folder-chevron {
                transform: rotate(180deg);
            }

            /* File List inside folder */
            .folder-content {
                display: none;
                padding: 0.75rem 1.5rem 1.25rem;
                background-color: rgba(15, 23, 42, 0.75);
            }

            .folder-item.open .folder-content {
                display: block;
            }

            .file-list {
                display: flex;
                flex-direction: column;
                gap: 0.65rem;
            }

            .file-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
                padding: 0.85rem 1.15rem;
                background-color: var(--bg-card);
                border: 1px solid var(--border);
                border-radius: 0.6rem;
                transition:
                    background-color 0.15s,
                    border-color 0.15s;
            }

            .file-row:hover {
                background-color: var(--bg-card-hover);
                border-color: rgba(56, 189, 248, 0.4);
            }

            .file-details {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                flex: 1;
                min-width: 0;
            }

            .file-icon {
                font-size: 1.25rem;
                color: var(--accent);
                flex-shrink: 0;
            }

            .file-meta {
                min-width: 0;
            }

            .file-title {
                font-size: 0.95rem;
                font-weight: 600;
                color: var(--text-main);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .file-path {
                font-size: 0.775rem;
                color: var(--text-muted);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                margin-top: 0.15rem;
            }

            .file-actions {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                flex-shrink: 0;
            }

            .btn-action {
                display: inline-flex;
                align-items: center;
                gap: 0.4rem;
                padding: 0.45rem 0.85rem;
                border-radius: 0.45rem;
                font-size: 0.825rem;
                font-weight: 500;
                cursor: pointer;
                text-decoration: none;
                transition: all 0.15s;
                border: 1px solid var(--border);
            }

            .btn-copy {
                background-color: var(--bg-surface);
                color: var(--text-muted);
            }

            .btn-copy:hover {
                color: var(--text-main);
                border-color: var(--accent);
            }

            .btn-copy.copied {
                background-color: var(--success-bg);
                color: var(--success);
                border-color: var(--success);
            }

            .btn-view {
                background-color: var(--accent);
                color: #0f172a;
                border-color: var(--accent);
                font-weight: 600;
            }

            .btn-view:hover {
                background-color: var(--accent-hover);
                border-color: var(--accent-hover);
            }

            /* Empty state */
            .empty-state {
                text-align: center;
                padding: 4rem 1.5rem;
                color: var(--text-muted);
            }

            .empty-icon {
                font-size: 3rem;
                margin-bottom: 0.75rem;
                color: var(--text-muted);
            }

            .empty-state p {
                font-size: 1rem;
            }

            /* Toast Notification */
            .toast {
                position: fixed;
                bottom: 2rem;
                right: 2rem;
                display: flex;
                align-items: center;
                gap: 0.6rem;
                background-color: #1e293b;
                color: var(--text-main);
                border: 1px solid var(--accent);
                padding: 0.75rem 1.25rem;
                border-radius: 0.6rem;
                font-size: 0.9rem;
                font-weight: 500;
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
                transform: translateY(150%);
                opacity: 0;
                transition:
                    transform 0.25s ease,
                    opacity 0.25s ease;
                z-index: 9999;
            }

            .toast.show {
                transform: translateY(0);
                opacity: 1;
            }

            .toast-icon {
                color: var(--success);
                font-size: 1.2rem;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <header>
                <div class="header-row">
                    <iconify-icon icon="fa7-solid:layer-group" class="header-icon"></iconify-icon>
                    <h1>Index de Arquivos & Protótipos</h1>
                </div>
                <p class="subtitle">
                    Explore os arquivos HTML e protótipos estáticos organizados por pasta. Pesquise, visualize ou copie
                    a URL direta de qualquer arquivo.
                </p>
            </header>

            <div class="toolbar">
                <div class="search-wrapper">
                    <iconify-icon icon="fa7-solid:magnifying-glass" class="search-icon"></iconify-icon>
                    <input
                        id="search"
                        class="search-input"
                        type="text"
                        placeholder="Buscar por nome de arquivo ou pasta..."
                        autocomplete="off"
                    />
                    <button id="search-clear" class="search-clear" title="Limpar busca">&times;</button>
                </div>

                <div class="toolbar-actions">
                    <button id="btn-toggle-all" class="btn-toggle-all" type="button">
                        <iconify-icon icon="fa7-solid:folder-tree"></iconify-icon>
                        <span id="btn-toggle-text">Expandir Todas</span>
                    </button>
                    <div id="stats" class="stats-badge">
                        <iconify-icon icon="fa7-solid:file-code"></iconify-icon>
                        <span id="stats-text">Carregando...</span>
                    </div>
                </div>
            </div>

            <section class="index-container">
                <div class="index-header">
                    <div class="index-title">
                        <iconify-icon icon="fa7-solid:folder-open"></iconify-icon>
                        <span>Index de Diretórios</span>
                    </div>
                </div>

                <div id="index-content">
                    <!-- Folders and files are dynamically generated here -->
                </div>
            </section>
        </div>

        <div id="toast" class="toast">
            <iconify-icon icon="fa7-solid:circle-check" class="toast-icon"></iconify-icon>
            <span id="toast-message">URL copiada com sucesso!</span>
        </div>

        <script id="__PAGES_DATA__" type="application/json">
            []
        </script>

        <script type="module">
            let allPages = [];
            const indexContentEl = document.getElementById('index-content');
            const searchInput = document.getElementById('search');
            const searchClearBtn = document.getElementById('search-clear');
            const statsText = document.getElementById('stats-text');
            const btnToggleAll = document.getElementById('btn-toggle-all');
            const btnToggleText = document.getElementById('btn-toggle-text');
            const toastEl = document.getElementById('toast');
            const toastMessageEl = document.getElementById('toast-message');

            let toastTimeout = null;
            let areAllExpanded = false;

            // Load pages data: first from inlined JSON script, then fallback to /api/pages
            async function loadPages() {
                const scriptEl = document.getElementById('__PAGES_DATA__');
                if (scriptEl && scriptEl.textContent) {
                    try {
                        const parsed = JSON.parse(scriptEl.textContent.trim());
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            allPages = parsed;
                        }
                    } catch (e) {
                        console.warn('Could not parse __PAGES_DATA__:', e);
                    }
                }

                if (allPages.length === 0) {
                    try {
                        const res = await fetch('./api/pages');
                        if (res.ok) {
                            allPages = await res.json();
                        }
                    } catch (e) {
                        console.warn('Could not fetch /api/pages:', e);
                    }
                }

                render();
            }

            function showToast(message) {
                toastMessageEl.textContent = message;
                toastEl.classList.add('show');
                if (toastTimeout) {
                    clearTimeout(toastTimeout);
                }
                toastTimeout = setTimeout(() => {
                    toastEl.classList.remove('show');
                }, 2200);
            }

            function escapeHtml(str) {
                return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            function getFileUrl(relPath) {
                const url = new URL(relPath, window.location.href);
                return url.href;
            }

            function render(filter = '') {
                const query = filter.trim().toLowerCase();
                const filtered = allPages.filter((path) => path.toLowerCase().includes(query));

                searchClearBtn.style.display = filter ? 'block' : 'none';

                statsText.textContent = `${filtered.length} ${filtered.length === 1 ? 'arquivo' : 'arquivos'}`;

                if (filtered.length === 0) {
                    indexContentEl.innerHTML = `
                        <div class="empty-state">
                            <iconify-icon icon="fa7-solid:file-circle-question" class="empty-icon"></iconify-icon>
                            <p>Nenhum arquivo encontrado para "<strong>${escapeHtml(filter)}</strong>".</p>
                        </div>
                    `;
                    return;
                }

                // Group files by folder
                const folderGroups = {};
                for (const filePath of filtered) {
                    const lastSlash = filePath.lastIndexOf('/');
                    const dir = lastSlash !== -1 ? filePath.substring(0, lastSlash) : 'raiz';
                    if (!folderGroups[dir]) {
                        folderGroups[dir] = [];
                    }
                    folderGroups[dir].push(filePath);
                }

                // When filtering, automatically expand all matching folders
                const shouldOpen = Boolean(query) || areAllExpanded;

                let html = '';
                let index = 0;
                for (const [dir, files] of Object.entries(folderGroups)) {
                    index++;
                    const folderId = `folder-${index}`;
                    const openClass = shouldOpen ? 'open' : '';

                    html += `
                        <div class="folder-item ${openClass}" id="${folderId}">
                            <button class="folder-trigger" type="button" data-folder-id="${folderId}">
                                <div class="folder-trigger-left">
                                    <iconify-icon icon="${openClass ? 'fa7-solid:folder-open' : 'fa7-solid:folder'}" class="folder-icon"></iconify-icon>
                                    <span class="folder-name">${escapeHtml(dir)}</span>
                                    <span class="folder-count-pill">${files.length} ${files.length === 1 ? 'item' : 'itens'}</span>
                                </div>
                                <div class="folder-trigger-right">
                                    <iconify-icon icon="fa7-solid:chevron-down" class="folder-chevron"></iconify-icon>
                                </div>
                            </button>
                            <div class="folder-content">
                                <div class="file-list">
                                    ${files
                                        .map((file) => {
                                            const fileName = file.split('/').pop();
                                            const fullUrl = getFileUrl(file);
                                            return `
                                            <div class="file-row">
                                                <div class="file-details">
                                                    <iconify-icon icon="fa7-solid:file-code" class="file-icon"></iconify-icon>
                                                    <div class="file-meta">
                                                        <div class="file-title">${escapeHtml(fileName)}</div>
                                                        <div class="file-path">${escapeHtml(file)}</div>
                                                    </div>
                                                </div>
                                                <div class="file-actions">
                                                    <button
                                                        type="button"
                                                        class="btn-action btn-copy"
                                                        data-url="${escapeHtml(fullUrl)}"
                                                        title="Copiar link direto"
                                                    >
                                                        <iconify-icon icon="fa7-solid:copy"></iconify-icon>
                                                        <span>Copiar URL</span>
                                                    </button>
                                                    <a
                                                        href="/${file}"
                                                        class="btn-action btn-view"
                                                        target="_blank"
                                                        rel="noopener noreferrer"
                                                        title="Visualizar arquivo em nova aba"
                                                    >
                                                        <iconify-icon icon="fa7-solid:arrow-up-right-from-square"></iconify-icon>
                                                        <span>Visualizar</span>
                                                    </a>
                                                </div>
                                            </div>
                                        `;
                                        })
                                        .join('')}
                                </div>
                            </div>
                        </div>
                    `;
                }

                indexContentEl.innerHTML = html;
            }

            // Accordion toggle & Copy URL click delegation
            indexContentEl.addEventListener('click', async (e) => {
                const triggerBtn = e.target.closest('.folder-trigger');
                if (triggerBtn) {
                    const folderId = triggerBtn.getAttribute('data-folder-id');
                    const folderEl = document.getElementById(folderId);
                    if (folderEl) {
                        const isOpen = folderEl.classList.toggle('open');
                        const iconEl = folderEl.querySelector('.folder-icon');
                        if (iconEl) {
                            iconEl.setAttribute('icon', isOpen ? 'fa7-solid:folder-open' : 'fa7-solid:folder');
                        }
                    }
                    return;
                }

                const copyBtn = e.target.closest('.btn-copy');
                if (copyBtn) {
                    const url = copyBtn.getAttribute('data-url');
                    try {
                        await navigator.clipboard.writeText(url);
                        copyBtn.classList.add('copied');
                        const label = copyBtn.querySelector('span');
                        const icon = copyBtn.querySelector('iconify-icon');
                        if (label) label.textContent = 'Copiado!';
                        if (icon) icon.setAttribute('icon', 'fa7-solid:check');

                        showToast('URL copiada para a área de transferência!');

                        setTimeout(() => {
                            copyBtn.classList.remove('copied');
                            if (label) label.textContent = 'Copiar URL';
                            if (icon) icon.setAttribute('icon', 'fa7-solid:copy');
                        }, 1800);
                    } catch (err) {
                        console.error('Failed to copy URL:', err);
                        showToast('Erro ao copiar URL.');
                    }
                }
            });

            // Expand/Collapse all
            btnToggleAll.addEventListener('click', () => {
                areAllExpanded = !areAllExpanded;
                btnToggleText.textContent = areAllExpanded ? 'Recolher Todas' : 'Expandir Todas';
                const folderItems = indexContentEl.querySelectorAll('.folder-item');
                folderItems.forEach((item) => {
                    if (areAllExpanded) {
                        item.classList.add('open');
                        const icon = item.querySelector('.folder-icon');
                        if (icon) icon.setAttribute('icon', 'fa7-solid:folder-open');
                    } else {
                        item.classList.remove('open');
                        const icon = item.querySelector('.folder-icon');
                        if (icon) icon.setAttribute('icon', 'fa7-solid:folder');
                    }
                });
            });

            // Search input listener
            searchInput.addEventListener('input', (e) => {
                render(e.target.value);
            });

            // Clear search
            searchClearBtn.addEventListener('click', () => {
                searchInput.value = '';
                render('');
                searchInput.focus();
            });

            // Load on start
            loadPages();
        </script>
    </body>
</html>
