<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Static Files & Prototypes</title>
        <script type="module">
            import 'iconify-icon';
        </script>
        <style>
            :root {
                --bg: #0f172a;
                --bg-card: #1e293b;
                --bg-card-hover: #334155;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --accent: #38bdf8;
                --accent-hover: #0ea5e9;
                --border: #334155;
                --badge-bg: rgba(56, 189, 248, 0.15);
                --badge-text: #7dd3fc;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    Roboto,
                    Oxygen,
                    Ubuntu,
                    Cantarell,
                    sans-serif;
                background-color: var(--bg);
                color: var(--text-main);
                min-height: 100vh;
                padding: 2.5rem 1.5rem;
            }

            .container {
                max-width: 1000px;
                margin: 0 auto;
            }

            header {
                margin-bottom: 2.5rem;
                border-bottom: 1px solid var(--border);
                padding-bottom: 1.5rem;
            }

            .header-title-row {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                margin-bottom: 0.5rem;
            }

            .header-icon {
                font-size: 2rem;
                color: var(--accent);
            }

            h1 {
                font-size: 2rem;
                font-weight: 700;
                letter-spacing: -0.025em;
            }

            .description {
                color: var(--text-muted);
                font-size: 1rem;
            }

            .toolbar {
                display: flex;
                flex-wrap: wrap;
                gap: 1rem;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 2rem;
            }

            .search-box {
                position: relative;
                flex: 1;
                min-width: 260px;
                max-width: 480px;
            }

            .search-icon {
                position: absolute;
                left: 0.85rem;
                top: 50%;
                transform: translateY(-50%);
                color: var(--text-muted);
                font-size: 1.15rem;
            }

            .search-input {
                width: 100%;
                padding: 0.75rem 1rem 0.75rem 2.6rem;
                border-radius: 0.5rem;
                border: 1px solid var(--border);
                background-color: var(--bg-card);
                color: var(--text-main);
                font-size: 0.95rem;
                outline: none;
                transition: border-color 0.2s;
            }

            .search-input:focus {
                border-color: var(--accent);
            }

            .stats-badge {
                display: inline-flex;
                align-items: center;
                gap: 0.4rem;
                padding: 0.4rem 0.85rem;
                border-radius: 9999px;
                background-color: var(--badge-bg);
                color: var(--badge-text);
                font-size: 0.875rem;
                font-weight: 500;
            }

            .folder-group {
                margin-bottom: 2rem;
            }

            .folder-title {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                font-size: 1.15rem;
                font-weight: 600;
                margin-bottom: 1rem;
                color: var(--accent);
            }

            .file-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 1rem;
            }

            .file-card {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                background-color: var(--bg-card);
                border: 1px solid var(--border);
                border-radius: 0.75rem;
                padding: 1.25rem;
                text-decoration: none;
                color: inherit;
                transition:
                    transform 0.15s,
                    border-color 0.15s,
                    background-color 0.15s;
            }

            .file-card:hover {
                transform: translateY(-2px);
                border-color: var(--accent);
                background-color: var(--bg-card-hover);
            }

            .file-info {
                display: flex;
                align-items: flex-start;
                gap: 0.75rem;
                margin-bottom: 1rem;
            }

            .file-icon {
                font-size: 1.5rem;
                color: var(--accent);
                flex-shrink: 0;
                margin-top: 0.15rem;
            }

            .file-name {
                font-size: 1.05rem;
                font-weight: 600;
                word-break: break-all;
            }

            .file-path {
                font-size: 0.8rem;
                color: var(--text-muted);
                word-break: break-all;
                margin-top: 0.25rem;
            }

            .file-action {
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 0.35rem;
                color: var(--accent);
                font-size: 0.875rem;
                font-weight: 500;
            }

            .empty-state {
                text-align: center;
                padding: 3rem 1rem;
                color: var(--text-muted);
                background-color: var(--bg-card);
                border-radius: 0.75rem;
                border: 1px dashed var(--border);
            }

            .empty-icon {
                font-size: 2.5rem;
                margin-bottom: 0.5rem;
                color: var(--text-muted);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <header>
                <div class="header-title-row">
                    <iconify-icon icon="fa7-solid:layer-group" class="header-icon"></iconify-icon>
                    <h1>Static Files & Prototypes</h1>
                </div>
                <p class="description">
                    Browse deployed static HTML files and design prototypes with preserved directory structure.
                </p>
            </header>

            <div class="toolbar">
                <div class="search-box">
                    <iconify-icon icon="fa7-solid:magnifying-glass" class="search-icon"></iconify-icon>
                    <input
                        id="search"
                        class="search-input"
                        type="text"
                        placeholder="Search files or folders..."
                        autocomplete="off"
                    />
                </div>
                <div id="stats" class="stats-badge">
                    <iconify-icon icon="fa7-solid:file"></iconify-icon>
                    <span id="stats-text">Loading files...</span>
                </div>
            </div>

            <main id="content">
                <!-- Dynamic folder groups will be rendered here -->
            </main>
        </div>

        <script id="__PAGES_DATA__" type="application/json">
            []
        </script>

        <script type="module">
            const pagesDataEl = document.getElementById('__PAGES_DATA__');
            let pages = [];

            try {
                pages = JSON.parse(pagesDataEl.textContent || '[]');
            } catch (err) {
                console.error('Failed to parse pages data:', err);
            }

            const contentEl = document.getElementById('content');
            const searchInput = document.getElementById('search');
            const statsText = document.getElementById('stats-text');

            function render(filter = '') {
                const query = filter.trim().toLowerCase();
                const filtered = pages.filter((path) => path.toLowerCase().includes(query));

                statsText.textContent = `${filtered.length} ${filtered.length === 1 ? 'file' : 'files'}`;

                if (filtered.length === 0) {
                    contentEl.innerHTML = `
                        <div class="empty-state">
                            <iconify-icon icon="fa7-solid:file-circle-question" class="empty-icon"></iconify-icon>
                            <p>No static HTML files found matching "<strong>${escapeHtml(filter)}</strong>".</p>
                        </div>
                    `;
                    return;
                }

                // Group files by directory
                const groups = {};
                for (const filePath of filtered) {
                    const lastSlash = filePath.lastIndexOf('/');
                    const dir = lastSlash !== -1 ? filePath.substring(0, lastSlash) : 'root';
                    if (!groups[dir]) {
                        groups[dir] = [];
                    }
                    groups[dir].push(filePath);
                }

                let html = '';
                for (const [dir, files] of Object.entries(groups)) {
                    html += `
                        <section class="folder-group">
                            <h2 class="folder-title">
                                <iconify-icon icon="fa7-solid:folder-open"></iconify-icon>
                                <span>${escapeHtml(dir)}</span>
                            </h2>
                            <div class="file-grid">
                                ${files
                                    .map((file) => {
                                        const fileName = file.split('/').pop();
                                        return `
                                        <a href="./${file}" class="file-card" target="_blank" rel="noopener noreferrer">
                                            <div class="file-info">
                                                <iconify-icon icon="fa7-solid:file-code" class="file-icon"></iconify-icon>
                                                <div>
                                                    <div class="file-name">${escapeHtml(fileName)}</div>
                                                    <div class="file-path">${escapeHtml(file)}</div>
                                                </div>
                                            </div>
                                            <div class="file-action">
                                                <span>Open</span>
                                                <iconify-icon icon="fa7-solid:arrow-up-right-from-square"></iconify-icon>
                                            </div>
                                        </a>
                                    `;
                                    })
                                    .join('')}
                            </div>
                        </section>
                    `;
                }

                contentEl.innerHTML = html;
            }

            function escapeHtml(str) {
                return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            searchInput.addEventListener('input', (e) => {
                render(e.target.value);
            });

            render();
        </script>
    </body>
</html>
